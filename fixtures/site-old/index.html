<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .card { padding: 16px; background: #ffffff; color: #111111; border: 1px solid #cccccc; }
  .card h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .lead { margin: 0 0 8px; }
  .badge { display: inline-block; padding: 2px 8px; background: #eeeeee; border-radius: 4px; }
  ul { display: flex; gap: 8px; list-style: none; margin: 8px 0 0; padding: 0; }
  @media (min-width: 768px) { .card { padding: 32px; } }
</style>
</head>
<body>
  <main class="card" id="main-card">
    <h2 class="title">Hello</h2>
    <p class="lead">Some <em>emphasized</em> paragraph text.</p>
    <span class="badge">New</span>
    <ul>
      <li>One</li>
      <li>Two</li>
      <li>Three</li>
    </ul>
  </main>
</body>
</html>
